spring:
  application:
    name: metropulse-simulator

metropulse:
  simulator:
    ingest-url: ${METROPULSE_SIMULATOR_INGEST_URL:http://localhost:8080/api/v1/telemetry/ingest}
    ingest-key: ${METROPULSE_SIMULATOR_INGEST_KEY:dev-ingest-key}
    seed: ${METROPULSE_SIMULATOR_SEED:42}
    interval: ${METROPULSE_SIMULATOR_INTERVAL:PT2S}
    initial-delay: ${METROPULSE_SIMULATOR_INITIAL_DELAY:PT5S}
    vehicle-ids:
      - BUS-042
