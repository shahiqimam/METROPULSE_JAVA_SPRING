services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/metropulse
      SPRING_DATASOURCE_USERNAME: metropulse
      SPRING_DATASOURCE_PASSWORD: metropulse
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      METROPULSE_INGEST_KEY: dev-ingest-key
      SPRING_SECURITY_USER_NAME: ${METROPULSE_OPERATOR_USERNAME:-operator}
      SPRING_SECURITY_USER_PASSWORD: ${METROPULSE_OPERATOR_PASSWORD:-metropulse-dev-password}
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "4200:80"

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      METROPULSE_SIMULATOR_INGEST_URL: http://backend:8080/api/v1/telemetry/ingest
      METROPULSE_SIMULATOR_INGEST_KEY: ${METROPULSE_INGEST_KEY:-dev-ingest-key}
      METROPULSE_SIMULATOR_SCENARIO: ${METROPULSE_SIMULATOR_SCENARIO:-NORMAL_OPERATION}
      METROPULSE_SIMULATOR_SEED: ${METROPULSE_SIMULATOR_SEED:-42}
      METROPULSE_SIMULATOR_INTERVAL: ${METROPULSE_SIMULATOR_INTERVAL:-PT2S}
    depends_on:
      - backend

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: metropulse
      POSTGRES_USER: metropulse
      POSTGRES_PASSWORD: metropulse
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metropulse -d metropulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      - kafka
