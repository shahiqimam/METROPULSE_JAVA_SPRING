spring:
  application:
    name: metropulse-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/metropulse
    username: metropulse
    password: metropulse
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

metropulse:
  telemetry:
    ingest-key: ${METROPULSE_INGEST_KEY:dev-ingest-key}
  auth:
    # Development default only. The production-style stack must supply its own.
    jwt-secret: ${METROPULSE_JWT_SECRET:metropulse-development-signing-secret-change-me}
    access-token-minutes: ${METROPULSE_ACCESS_TOKEN_MINUTES:15}
    refresh-token-days: ${METROPULSE_REFRESH_TOKEN_DAYS:7}
    allowed-origins: ${METROPULSE_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:8080}
  operations:
    consumer-enabled: ${METROPULSE_OPERATIONS_CONSUMER_ENABLED:true}
    consumer-group: ${METROPULSE_OPERATIONS_CONSUMER_GROUP:metropulse-operational-state}
  realtime:
    broadcast-delay-ms: ${METROPULSE_REALTIME_BROADCAST_DELAY_MS:2000}
  outbox:
    enabled: ${METROPULSE_OUTBOX_ENABLED:true}
    topic: ${METROPULSE_OUTBOX_TOPIC:metropulse.telemetry.v1}
    batch-size: ${METROPULSE_OUTBOX_BATCH_SIZE:25}
    publish-delay-ms: ${METROPULSE_OUTBOX_PUBLISH_DELAY_MS:5000}

# Structured logging.
#
# A request id is generated (or taken from X-Request-Id) for every request and put in the MDC, which
# was pointless while logs were plain text: the id never reached a log line, so the one thing it
# exists for - following a single request through the outbox, the consumer and the projection - could
# not be done. ECS is a format log aggregators already understand, and Spring Boot emits it without
# another dependency.
#
# Set METROPULSE_LOG_FORMAT to an empty value for human-readable console output while working
# locally. Only ecs, gelf, logstash or a formatter class name are accepted; anything else - including
# a word like "none" - fails the application at startup rather than falling back.
logging:
  structured:
    format:
      console: ${METROPULSE_LOG_FORMAT:ecs}
  level:
    com.metropulse: ${METROPULSE_LOG_LEVEL:INFO}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
