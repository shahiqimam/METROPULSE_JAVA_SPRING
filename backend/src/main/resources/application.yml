spring:
  application:
    name: metropulse-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/metropulse
    username: metropulse
    password: metropulse
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

metropulse:
  telemetry:
    ingest-key: ${METROPULSE_INGEST_KEY:dev-ingest-key}
  operations:
    consumer-enabled: ${METROPULSE_OPERATIONS_CONSUMER_ENABLED:true}
    consumer-group: ${METROPULSE_OPERATIONS_CONSUMER_GROUP:metropulse-operational-state}
  outbox:
    enabled: ${METROPULSE_OUTBOX_ENABLED:true}
    topic: ${METROPULSE_OUTBOX_TOPIC:metropulse.telemetry.v1}
    batch-size: ${METROPULSE_OUTBOX_BATCH_SIZE:25}
    publish-delay-ms: ${METROPULSE_OUTBOX_PUBLISH_DELAY_MS:5000}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info

server:
  port: 8080
