# Production-style stack.
#
# The difference from docker-compose.yml is not "more containers" but exposure: here only nginx has a
# published port. PostgreSQL, Kafka, Redis and the backend are reachable only from inside the Compose
# network, so the attack surface is one reverse proxy rather than five services.
#
# Every secret is required rather than defaulted. A stack that silently starts with a development
# signing key is worse than one that refuses to start.
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build

services:
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
    ports:
      - "${METROPULSE_HTTP_PORT:-8080}:80"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    # No ports: nginx serves it.
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:?set POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:?set POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      METROPULSE_INGEST_KEY: ${METROPULSE_INGEST_KEY:?set METROPULSE_INGEST_KEY}
      METROPULSE_JWT_SECRET: ${METROPULSE_JWT_SECRET:?set METROPULSE_JWT_SECRET}
      METROPULSE_ALLOWED_ORIGINS: ${METROPULSE_ALLOWED_ORIGINS:?set METROPULSE_ALLOWED_ORIGINS}
      # Validate rather than create: Flyway owns the schema, and a surprise Hibernate DDL in
      # production is how a column quietly disappears.
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      METROPULSE_SIMULATOR_INGEST_URL: http://backend:8080/api/v1/telemetry/ingest
      METROPULSE_SIMULATOR_INGEST_KEY: ${METROPULSE_INGEST_KEY:?set METROPULSE_INGEST_KEY}
      METROPULSE_SIMULATOR_SCENARIO: ${METROPULSE_SIMULATOR_SCENARIO:-NORMAL_OPERATION}
    depends_on:
      - backend
    restart: unless-stopped

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    # No published port. The database is reachable only from the Compose network.
    volumes:
      - metropulse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      # One listener only: nothing outside the network talks to Kafka.
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-4L6g3nShT-eMCtK--X86sw}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - metropulse-kafka:/var/lib/kafka/data
    restart: unless-stopped

# Kafka UI is deliberately absent: it is a development convenience that would expose topic contents
# and cluster administration to anyone who reached it.

volumes:
  metropulse-postgres:
  metropulse-kafka:
