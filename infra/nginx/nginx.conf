# Public edge for the production-style stack.
#
# Everything else - the API, the database, Kafka, Redis - is reachable only from inside the Compose
# network. This file is the entire surface exposed to the outside.

server {
    listen 80;
    server_name _;

    # Do not advertise the server version to anyone probing the edge.
    server_tokens off;

    # Docker's embedded DNS, re-checked every 10 seconds.
    #
    # This matters more than it looks. nginx resolves a hostname in a static `upstream` block exactly
    # once, at startup, and caches the address forever. Restart the backend, it comes back on a new
    # container IP, and nginx keeps proxying to the dead one - every request 502s until nginx itself
    # is restarted. Naming the upstream through a variable (below) forces re-resolution instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Conservative defaults. A telemetry payload is a few hundred bytes; anything much larger is
    # either a mistake or an attempt to exhaust memory.
    client_max_body_size 256k;
    client_body_timeout 10s;
    client_header_timeout 10s;

    # Headers that cost nothing and remove whole classes of attack.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location /api/ {
        # The variable is what makes nginx resolve at request time rather than at startup. With a
        # variable, nginx does not rewrite the path, so $request_uri passes it through unchanged -
        # which is what we want, since the backend serves these paths directly.
        set $api_upstream backend:8080;
        proxy_pass http://$api_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Requests carry a request id end to end, so a log line here ties to one in the API.
        proxy_set_header X-Request-ID $request_id;
    }

    # The STOMP endpoint is /ws exactly. Without the upgrade headers nginx proxies the handshake as
    # an ordinary request and the connection fails with a 200 rather than switching protocols.
    location /ws {
        set $ws_upstream backend:8080;
        proxy_pass http://$ws_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # A socket carrying no traffic must not be closed merely for being quiet.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Liveness for a load balancer, without exposing the rest of Actuator.
    location = /health {
        set $health_upstream backend:8080;
        proxy_pass http://$health_upstream/api/v1/health;
        access_log off;
    }

    location / {
        set $app_upstream frontend:80;
        proxy_pass http://$app_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
